[workspace]
resolver = "3"
members = [
    "crates/kchat-backup",
    "crates/kchat-mls",
    "crates/kchat-mls-uniffi",
    "crates/kchat-mls-napi",
    "crates/uq-openmls",
    "crates/kchat-storage-provider",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["KChat Authors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/KChatGlobal/kchat-rust-sdk"
homepage = "https://kchat.com"
keywords = ["mls", "e2ee", "messaging", "openmls", "crypto"]
categories = ["cryptography", "api-bindings"]

[workspace.dependencies]
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
secrecy = "0.10.3"
uuid = "1.26"
zeroize = "1.9"
hkdf = "0.13"
sha2 = "0.11"
getrandom = "0.4.3"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
aead-stream = { version = "0.6", features = ["alloc"] }
zstd = "0.14"

openmls = { version = "0.9.0" }
openmls_basic_credential = { version = "0.6.0" }
openmls_traits = { version = "0.6.0" }
openmls_rust_crypto = { version = "0.6.0" }

[patch.crates-io]
openmls = { git = "https://github.com/KChatGlobal/openmls.git", tag = "kchat-v0.9.1" }
openmls_basic_credential = { git = "https://github.com/KChatGlobal/openmls.git", tag = "kchat-v0.9.1" }
openmls_traits = { git = "https://github.com/KChatGlobal/openmls.git", tag = "kchat-v0.9.1" }
openmls_rust_crypto = { git = "https://github.com/KChatGlobal/openmls.git", tag = "kchat-v0.9.1" }
