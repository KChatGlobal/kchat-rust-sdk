[package]
name = "kchat_backup_napi"
description = "Node.js (NAPI-RS) bindings for the KChat backup SDK."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.2", features = ["napi6"] }
napi-derive = "3.0.0"
kchat-backup = { path = "../kchat-backup" }
thiserror = { workspace = true }
zeroize = { workspace = true }

[build-dependencies]
napi-build = "2"
