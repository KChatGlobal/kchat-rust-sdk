[package]
name = "kchat-file-crypto"
description = "File encryption core for KChat: VOPRF-assisted content keys, STREAM content encryption and an SQLCipher key store."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
aead-stream = { workspace = true }
chacha20poly1305 = { workspace = true }
# Control message payloads are CBOR, decoded into strict serde structs.
ciborium = "0.2"
ed25519-dalek = "2.2"
getrandom = { workspace = true }
hkdf = { workspace = true }
rand_core = { version = "0.6", default-features = false }
# The key store must be encrypted; the store refuses to open without SQLCipher.
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# Pinned exactly: the OPRF wire format and outputs must not drift with patch releases.
voprf = { version = "=0.5.0", default-features = false, features = [
    "ristretto255-ciphersuite",
] }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
tempfile = "3"
# `alloc` provides the batch evaluator for the in-test key service;
# `danger` exposes deterministic blinding for the RFC 9497 vectors.
voprf = { version = "=0.5.0", default-features = false, features = [
    "ristretto255-ciphersuite",
    "alloc",
    "danger",
] }
