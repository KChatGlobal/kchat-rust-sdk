[package]
name = "kchat-mls"
description = "High-level KChat MLS group lifecycle and message processing on top of OpenMLS."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
openmls = { workspace = true, features = ["test-utils"] }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }
openmls_rust_crypto = { workspace = true }
uq-openmls = { workspace = true }
kchat_storage_provider = { workspace = true }

rusqlite = { workspace = true, features = ["bundled"] }
thiserror = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bip39 = { version = "=3.0.0", features = ["zeroize"] }
ed25519-dalek = { version = "=3.0.0", features = ["zeroize"] }
p256 = { version = "=0.14.0", features = ["ecdsa"] }
getrandom = "0.4.3"
hkdf = "0.13"
sha2 = "0.11"
uuid = "=1.26.0"
zeroize = { workspace = true, features = ["derive"] }

[features]
extensions-draft = [
    "openmls/extensions-draft",
    "uq-openmls/extensions-draft",
    "kchat_storage_provider/extensions-draft",
]
